# Grid over batch_size x branch_decorr_scale x five seeds, on the xi classifier +
# conditional prior config, to measure run-to-run spread.
#   wandb sweep scripts/seeds_sweep.yaml
#   wandb agent <sweep-id>       # one agent per GPU
#
program: dreamer.py
method: grid
project: dreamer-v3

metric:
  name: eval_return
  goal: maximize

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  # reward_head_task:
  #   values: [False, True]
  # xi_ctx_cond:
  #   values: [False, True]
  xi_ctx_scale:
    values: [0.0, 0.5, 1.0]
  # branch_decorr_scale:
  #   values: [0.0, 0.5, 1.0]
  
  

# dreamer.py takes "--flag value", so this needs ${args}, not
# ${args_no_hyphens}, and --configs must come before it.
command:
  - ${env}
  - python
  - ${program}
  - --configs
  - bandits
  - denoised
  - --task
  - bandits_distractor
  - --probe_state
  - "True"
  - --probe_early_steps
  - "3"
  - --random_until
  - "16000"
  - --exp_label
  - bandits_ablation
  - --kl_free
  - "0.5"
  - ${args}