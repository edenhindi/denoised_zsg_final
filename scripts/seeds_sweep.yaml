# Five seeds of the xi classifier + conditional prior config, to measure
# run-to-run spread.
#   wandb sweep scripts/seeds_sweep.yaml
#   wandb agent <sweep-id>       # one agent per GPU
#
program: dreamer.py
method: grid
project: dreamer-v3

metric:
  name: eval_return
  goal: maximize

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  wandb_group:
    value: xi_cls_cond_300k_decor

# dreamer.py takes "--flag value", so this needs ${args}, not
# ${args_no_hyphens}, and --configs must come before it.
command:
  - ${env}
  - python
  - ${program}
  - --configs
  - bandits
  - --task
  - bandits_distractor
  - --use_exo
  - "True"
  - --probe_state
  - "True"
  - --probe_early_steps
  - "3"
  - --reward_head_action
  - "True"
  - --random_until
  - "16000"
  - --steps
  - "3e5"
  - --xi_ctx_cond
  - "True"
  - --xi_ctx_scale
  - "1.0"
  - --exp_label
  - xi_cls_cond_300k_decor
  - --branch_decorr_scale
  - "1.0"
  - ${args}
