# Five seeds of one config, to measure run-to-run spread.
#   wandb sweep scripts/seeds_sweep.yaml
#   wandb agent <sweep-id>       # one agent per GPU
program: dreamer.py
method: grid
project: dreamer-v3

metric:
  name: eval_return
  goal: maximize

parameters:
  seed:
    values: [0, 1, 2, 3, 4]
  wandb_group:
    value: seeds_baseline

# dreamer.py takes "--flag value", so this needs ${args}, not
# ${args_no_hyphens}, and --configs must come before it.
command:
  - ${env}
  - python
  - ${program}
  - --configs
  - bandits
  - --task
  - bandits_distractor
  - --use_exo
  - "True"
  - --probe_state
  - "True"
  - --exp_label
  - bandits_smaller_latents_xi_encoder_higherhorizon_lessentropy
  - ${args}
