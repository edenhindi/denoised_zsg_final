defaults:
  exp_label: 'exp'
  # Repeats of one config share this so wandb aggregates them into a mean/band.
  # Empty means ungrouped.
  wandb_group: ''
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  steps: 1e6
  eval_every_collection_episodes: 200
  eval_episode_num: 20
  test_episode_num: 1000
  log_every: 1e4
  log_imagined_horizon_effective_length: False
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  expl_gifs: False
  video_pred_log: False

  # Environment
  task: 'dmc_walker_walk'
  size: [ 64, 64 ]
  envs: 10
  action_repeat: 1
  time_limit: 1000
  grayscale: False
  prefill: 25
  # Collect with a uniform-random policy for this many agent frames while the models
  # still train, so the world model's early gradients come from data where the action
  # is independent of the observation. 0 disables.
  random_until: 0
  eval_noise: 0.0
  reward_EMA: True
  num_meta_episodes: 1
  max_episode_length: 100
  meta_learning: True

  # Task split (zero-shot generalization). Off by default, so every existing
  # config keeps its current behavior.
  task_split: False
  task_split_seed: 0
  task_pool_size: 60
  task_train_size: 20
  task_val_size: 20
  task_test_size: 20
  # Contiguous ids per split, so train ids are dense class indices for xi's classifier.
  task_split_contiguous: True

  # Model
  rnn_detach_every: -1
  dyn_cell: 'gru_layer_norm'
  dyn_hidden: 64
  dyn_deter: 128
  dyn_stoch: 4
  dyn_discrete: 16
  dyn_input_layers: 1
  dyn_output_layers: 1
  dyn_rec_depth: 1
  dyn_shared: False
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  dyn_temp_post: True

  # Set False for the control condition: zeros the bandits distractor in every env,
  # train included, so the shortcut "distractor -> optimal arm" does not exist and
  # the only way to solve a task is to explore. In defaults so it is a CLI flag
  # without passing the bandits block: --use_distractor False
  use_distractor: True

  # Exogenous module. An action-free RSSM (xi_t -> xi_{t+1}) whose decoded output is
  # added to the endogenous decoder's, for observation keys only. The policy and the
  # imagination rollout stay endogenous-only, so xi can absorb observation structure
  # the agent cannot act on without polluting the values it optimizes.
  # Off by default: use_exo False leaves every existing config bit-identical.
  use_exo: False
  xi_deter: 128
  xi_stoch: 4
  xi_discrete: 16
  xi_hidden: 64
  xi_input_layers: 1
  xi_output_layers: 1
  xi_kl_scale: 1.0
  # No free nats for xi, unlike kl_free for the endogenous stream.
  xi_kl_free: 0.0
  xi_dyn_scale: 0.5
  xi_rep_scale: 0.1
  # Task-conditional xi prior p(xi_t | xi_{t-1}, task_id), replacing the old context
  # classifier. Needs task_split_contiguous and labelled task_ids.
  xi_ctx_cond: True
  xi_ctx_dim: 16
  # What the exogenous decoder branch reads: 'deter' or 'feat' (deter + stoch).
  xi_head_input: 'feat'

  # CLUB: a variational upper bound on I(endogenous feat; xi feat), added to the
  # world-model loss to drive the two streams apart. Needs use_exo. The approximator
  # q(xi|z) is fit by its own optimizer on detached features, so it never shapes the
  # world model except through the bound. 0 disables it.
  club_scale: 0.0
  club_hidden: 256
  club_layers: 2
  club_lr: 3e-4
  # Which part of each stream the bound is taken over: 'feat' (deter ++ stoch),
  # 'deter', 'stoch', or 'logit'. Applied to both streams, and independent of
  # xi_head_input, which controls what the *decoder* branch reads.
  # 'logit' is the categorical's parameters rather than a draw from it: same
  # width as 'stoch', but continuous and free of per-step sampling noise, so the
  # diagonal-Gaussian q is much better specified. Needs discrete latents.
  # 'stoch' keeps the pressure off the recurrent state, where the within-episode
  # explore/exploit history lives -- penalizing MI there can strip the arm-relevant
  # history the policy needs, since distractor and arm are correlated on train tasks.
  # Note 'feat'/'stoch' feed a flattened one-hot categorical to a diagonal-Gaussian
  # q, which is misspecified and inflates the magnitude of club_nll.
  club_input: 'feat'
  # Standardize xi (running mean/var, no_grad buffers) before the bound. The logvar
  # head is tanh-bounded to [-1, 1], so q can only express variances in [e^-1, e^1];
  # when xi's own scale falls below that, q pins every dim at the floor and the 1/var
  # factor inflates both terms of the bound while their difference stays small --
  # club_diff_snr ~0.015 with club_logvar_frac_floor 0.96 is that failure. False
  # restores the pre-normalization behaviour of runs up to #11.
  # Likelihood family for q. 'gaussian' is the original: misspecified when xi is a
  # flattened one-hot draw, which pins the logvar at its floor (frac_floor ~0.96)
  # and inflates both terms of the bound while their difference stays ~0.
  # 'categorical' models the exogenous categorical with a categorical -- no variance
  # parameter to saturate -- and conditions on xi_deter by concatenating it onto the
  # input, so the bound is I(z; xi_stoch | xi_deter). Needs xi_discrete.
  club_q: 'gaussian'
  club_normalize_xi: True
  club_norm_momentum: 0.99
  # Approximator steps per world-model step. The bound is only valid once q has
  # fit p(xi|z), so q should stay ahead of the streams it is measuring.
  club_inner_steps: 1

  # Action-MI terms. Both condition on a learned task embedding and are taken
  # against the action: MINE maximizes I((e, s, s'); a) so the endogenous
  # transition stays action-informative, CLUB minimizes I((e, xi, xi'); a)
  # so the exogenous stream does not encode the action. s/s' are get_feat(post) at
  # consecutive steps, so the last timestep is dropped. Both use full feat
  # regardless of club_input. 0 disables each independently; the CLUB one needs
  # use_exo. Estimators are fit by their own optimizers on detached inputs.
  act_mine_scale: 0.0
  act_club_scale: 0.0
  act_mi_hidden: 256
  act_mi_layers: 2
  act_mi_lr: 3e-4
  act_mi_inner_steps: 1
  # MINE's gradient bias correction; see mi_estimators.MINE.
  act_mine_ema_decay: 0.99
  act_mine_clip: 10.0
  # Both terms condition on a fixed one-hot of the task id, of width
  # task_train_size -- not a learned embedding, which would take gradients from
  # these same objectives and could satisfy them by reshaping the task code rather
  # than the streams. Columns are indexed by task_id, so this needs
  # task_split_contiguous and labelled task_ids; unlabelled steps and ids outside
  # the train split are dropped from both estimators.

  # Detached linear probes from deter/stoch to task id and optimal arm. Diagnostic
  # only: they never affect the world model. Needs labelled task_ids.
  probe_state: False
  probe_early_steps: 3

  grad_heads: [ 'decoder', 'reward', 'cont' ]
  units: 128
  reward_layers: 2
  cont_layers: 2
  value_layers: 2
  actor_layers: 2
  act: 'SiLU'
  norm: 'LayerNorm'
  encoder:
    { mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 2, mlp_units: 512, symlog_inputs: True }
  decoder:
    { mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 2, mlp_units: 512, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse }
  value_head: 'symlog_disc'
  reward_head: 'symlog_disc'
  # Feed the action to the reward head, so it is r = f(feat, a) and cannot fit reward
  # without representing the action. online-zsg's head is f(x_flat, action).
  reward_head_action: False
  # Which slice of get_feat the reward head reads: 'feat', 'stoch', 'deter'.
  # 'stoch' + reward_head_action matches online-zsg's f(x_flat, action).
  reward_head_input: 'feat'
  dyn_scale: '0.5'
  rep_scale: '0.1'
  kl_free: '1.0'
  cont_scale: 1.0
  reward_scale: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  action_unimix_ratio: 0.01
  initial: 'learned'
  reconstruction_window: 3

  # Training
  batch_size: 16
  batch_length: 64
  behavior_batch_length: 512
  hidden_states_subsample: 64
  sample_first: False
  train_ratio: 0.03
  mamba_context: True
  initial_wm_horizon: 50
  reach_wm_horizon_limit: -1
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  value_lr: 3e-5
  actor_lr: 3e-5
  ac_opt_eps: 1e-5
  value_grad_clip: 100
  actor_grad_clip: 100
  dataset_size: 1000000
  slow_value_target: True
  slow_target_update: 1
  slow_target_fraction: 0.02
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 10
  imag_gradient: 'dynamics'
  imag_gradient_mix: '0.0'
  imag_sample: True
  # Which slice of get_feat the actor reads: 'feat' (stoch+deter), 'stoch', 'deter'.
  # The value always reads the full feature.
  actor_input: 'feat'
  actor_dist: 'normal'
  actor_entropy: '3e-4'
  actor_state_entropy: 0.0
  actor_init_std: 1.0
  actor_min_std: 0.1
  actor_max_std: 1.0
  actor_temp: 0.1
  expl_amount: 0.0
  eval_state_mean: False
  collect_dyn_sample: True
  behavior_stop_grad: True
  value_decay: 0.0
  future_entropy: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False
  all_layers: 0

dmc_vision:
  steps: 3e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  video_pred_log: true
  encoder: { mlp_keys: '$^', cnn_keys: 'image' }
  decoder: { mlp_keys: '$^', cnn_keys: 'image' }

dmc_proprio:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  max_episode_length: 300
  logdir: ./dmc_proprio
  detach_image_from_obs: true
  encoder: { mlp_keys: '.*', cnn_keys: '$^' }
  decoder: { mlp_keys: '.*', cnn_keys: '$^' }

dmc_proprio_goal:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  max_episode_length: 300
  logdir: ./dmc_proprio_goal
  detach_image_from_obs: true
  encoder: { mlp_keys: '.*', cnn_keys: "image" }
  decoder: { mlp_keys: '.*', cnn_keys: "image" }
  goal_dist_theta: 1
  goal_dist_radius: 1
  dense_reward: False
  small_state_space: True
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05
  num_goals: 1

panda_reacher:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.06
  envs: 1
  max_episode_length: 50
  num_meta_episodes: 3
  logdir: ./panda_reacher
  encoder: { mlp_keys: '.*', cnn_keys: "image" }
  decoder: { mlp_keys: '.*', cnn_keys: "image" }
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05

dmc_vision_goal:
  steps: 30e6
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.06
  max_episode_length: 300
  logdir: ./dmc_vision_goal
  detach_image_from_obs: false
  encoder: { mlp_keys: '\b(reward|time_step)\b', cnn_keys: 'image' }
  decoder: { mlp_keys: '\b(reward|time_step)\b', cnn_keys: 'image' }
  goal_dist_theta: 1
  goal_dist_radius: 1
  dense_reward: False
  small_state_space: True
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05
  num_goals: 1

rooms:
  steps: 6e6
  reach_wm_horizon_limit: 5e6
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./rooms
  eval_episode_num: 100
  imag_gradient: 'reinforce'
  actor_dist: 'onehot'
  train_ratio: 0.1
  imag_horizon: 2
  num_cells: 3
  num_rooms: 3

halfcircle:
  steps: 2e6
  num_meta_episodes: 3
  initial_wm_horizon: 300
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./halfcircle
  train_ratio: 0.01
  imag_horizon: 2
  all_layers: 2
  max_episode_length: 100
  goal_radius: 2

halfcirclewind:
  steps: 2e6
  initial_wm_horizon: 300
  num_meta_episodes: 3
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./halfcirclewind
  train_ratio: 0.2
  imag_horizon: 10
  all_layers: 2
  max_episode_length: 100
  goal_radius: 2
  wind_force: 0.3

escaperoom:
  steps: 4e6
  initial_wm_horizon: 120
  num_meta_episodes: 2
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./escaperoom
  train_ratio: 0.2
  imag_horizon: 10
  all_layers: 2
  max_episode_length: 60
  goal_radius: 2

humanoiddir:
  steps: 30e6
  reach_wm_horizon_limit: 15e6
  max_episode_length: 200
  num_meta_episodes: 2
  logdir: ./humanoid
  encoder: { mlp_keys: '.*', cnn_keys: '$^' }
  decoder: { mlp_keys: '.*', cnn_keys: '$^' }
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05

bandits:
  steps: 1e5
  # Must be positive: the world-model horizon curriculum divides by this, and the
  # default sentinel of -1 drives the horizon negative as training progresses.
  reach_wm_horizon_limit: 2e4
  logdir: ./bandits
  encoder: { mlp_keys: '.*', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64 }
  decoder: { mlp_keys: '.*', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64 }
  units: 64
  actor_dist: 'onehot'
  imag_gradient: 'reinforce'
  imag_horizon: 10
  all_layers: 2
  train_ratio: 0.1
  max_episode_length: 20
  initial_wm_horizon: 10
  num_meta_episodes: 1
  meta_learning: True
  task_split: True
  # 20/20/20 over 60 tasks. optimal_arm is task_id % num_arms, so a 4-task val
  # set could not cover 5 arms: the old split put half of val on arm 2 and never
  # exercised arms 0 or 1, letting a constant policy look good on val.
  eval_episode_num: 20
  test_episode_num: 200
  prefill: 8
  num_arms: 5
  distractor_dim: 8
  reward_mode: 'binary'
  static_distractor: True
  generator_seed: 0

  actor_lr: 3e-04
  model_lr: 1e-3
  value_lr: 3e-04
  # actor_entropy: '1e-3'
  discount: 0.99
  
  log_every: 500
# Same as `bandits` but the distractor drifts within the episode, so it is harder
# to bind to a single optimal arm. Run as: --configs bandits bandits_drift
bandits_drift:
  logdir: ./bandits_drift
  static_distractor: False

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
