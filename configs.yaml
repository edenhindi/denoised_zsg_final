defaults:
  exp_label: 'exp'
  # Repeats of one config share this so wandb aggregates them into a mean/band.
  # Empty means ungrouped.
  wandb_group: ''
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  seed: 0
  steps: 1e6
  eval_every_collection_episodes: 200
  # Episodes per held-out task, not totals: eval and test run every task in their
  # split this many times, so coverage is balanced by construction.
  eval_repeats: 1
  test_repeats: 10
  log_every: 1e4
  log_imagined_horizon_effective_length: False
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  expl_gifs: False
  video_pred_log: False

  # Environment
  task: 'dmc_walker_walk'
  size: [ 64, 64 ]
  envs: 10
  action_repeat: 1
  time_limit: 1000
  grayscale: False
  prefill: 25
  # Collect with a uniform-random policy for this many agent frames while the models
  # still train, so the world model's early gradients come from data where the action
  # is independent of the observation. 0 disables.
  random_until: 0
  eval_noise: 0.0
  reward_EMA: True
  num_meta_episodes: 1
  max_episode_length: 100
  meta_learning: True

  # Task split (zero-shot generalization). Off by default, so every existing
  # config keeps its current behavior.
  task_split: False
  task_split_seed: 0
  # Absolute task counts, not fractions. The dataset is exactly their sum, sampled
  # in order, so train ids are 0..task_train_size-1 -- which is what xi's context
  # classifier indexes (ids outside that range are treated as unlabelled).
  task_train_size: 20
  task_val_size: 20
  task_test_size: 20

  # Model
  rnn_detach_every: -1
  dyn_cell: 'gru_layer_norm'
  dyn_hidden: 64
  dyn_deter: 128
  dyn_stoch: 4
  dyn_discrete: 16
  dyn_input_layers: 1
  dyn_output_layers: 1
  dyn_rec_depth: 1
  dyn_shared: False
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  dyn_temp_post: True

  # Set False for the control condition: zeros the bandits distractor in every env,
  # train included, so the shortcut "distractor -> optimal arm" does not exist and
  # the only way to solve a task is to explore. In defaults so it is a CLI flag
  # without passing the bandits block: --use_distractor False
  use_distractor: True

  # Exogenous module. An action-free RSSM (xi_t -> xi_{t+1}) whose decoded output is
  # added to the endogenous decoder's, for observation keys only. The policy and the
  # imagination rollout stay endogenous-only, so xi can absorb observation structure
  # the agent cannot act on without polluting the values it optimizes.
  # Off by default: use_exo False leaves every existing config bit-identical.
  use_exo: False
  xi_deter: 128
  xi_stoch: 4
  xi_discrete: 16
  xi_hidden: 64
  xi_input_layers: 1
  xi_output_layers: 1
  xi_kl_scale: 1.0
  # No free nats for xi, unlike kl_free for the endogenous stream.
  xi_kl_free: 0.0
  xi_dyn_scale: 0.5
  xi_rep_scale: 0.1
  # Task-conditional xi prior p(xi_t | xi_{t-1}, task_id), replacing the old context
  # classifier. Needs train task ids 0..task_train_size-1, which the ordered
  # split guarantees, and labelled task_ids.
  xi_ctx_cond: True
  xi_ctx_dim: 16
  # Classifier xi_deter -> task_id, added to the loss. Supervises the *posterior*,
  # so xi must infer the task from the observation; xi_ctx_cond instead tells the
  # prior, which lets the posterior match it and carry nothing. Independent knobs:
  # either, both, or neither. 0 disables. Needs labelled task_ids.
  xi_ctx_scale: 0.0
  # What the exogenous decoder branch reads: 'deter' or 'feat' (deter + stoch).
  xi_head_input: 'feat'
  # Penalize Cov(endo_mean, exo_mean) per dimension. The decoder scores only their
  # sum, so the split is unidentifiable and drifts into large opposite-signed
  # predictions that cancel. Assumes the additive decoder; says nothing about
  # which dims belong to which stream. 0 disables. Needs use_exo.
  branch_decorr_scale: 0.0
  # Feed the endogenous encoder o_t - o_hat(xi_{t-1}) instead of o_t, where the
  # prediction comes from the exogenous prior and is detached. Needs use_exo.
  endo_obs_diff: False
  # Split the decoder too: the exogenous branch predicts the full o_t and the
  # endogenous branch the residual, instead of one distribution over their sum.
  endo_obs_diff_split: False

  # Mutual-information terms, named for the pair each is taken over. All three are
  # off unless use_infolosses is True; a scale of 0 then disables one individually.
  # Metrics: mi/<term>/{bound,loss,fit} -- read `bound` only alongside `fit`, which
  # says whether the estimator has converged.
  #
  #   endo_exo_mi  I(z; xi)           CLUB upper bound, minimized. Needs use_exo.
  #   act_endo_mi  I((e, s, s'); a)   MINE lower bound, maximized.
  #   act_exo_mi   I((e, xi, xi'); a) CLUB upper bound, minimized. Needs use_exo.
  #   rew_endo_mi  I((e, s, s'); G)   MINE lower bound, maximized.
  #   rew_exo_mi   I((e, xi, xi'); G) CLUB upper bound, minimized. Needs use_exo.
  #   embed_exo_mi I(embed; xi_stoch) CLUB upper bound, minimized. Needs use_exo.
  use_infolosses: False

  # Shared net/optimizer defaults; a term overrides one as <term>_<key>, e.g.
  # endo_exo_mi_lr. inner_steps is estimator steps per world-model step.
  mi_hidden: 256
  mi_layers: 2
  mi_lr: 3e-4
  mi_inner_steps: 1

  endo_exo_mi_scale: 0.1
  # Which part of each stream the bound is taken over: 'feat' (deter ++ stoch),
  # 'deter', 'stoch', or 'logit'. Applied to both streams, independent of
  # xi_head_input. 'logit' is continuous and sampling-noise-free, so the Gaussian q
  # is far better specified; needs discrete latents. 'stoch' keeps the pressure off
  # the recurrent state, where the explore/exploit history lives. 'feat'/'stoch'
  # feed a flattened one-hot to a diagonal-Gaussian q, which is misspecified.
  endo_exo_mi_input: 'feat'
  # 'gaussian' is misspecified against a one-hot draw: it pins the logvar at its
  # floor (frac_floor ~0.96) and inflates both terms while their difference stays
  # ~0. 'categorical' has no variance to saturate and conditions on xi_deter, so
  # the bound is I(z; xi_stoch | xi_deter). Needs xi_discrete.
  endo_exo_mi_q: 'categorical' # can be categorical or gaussian
  # Standardize xi before the bound. The tanh-bounded logvar can only express
  # variances in [e^-1, e^1]; below that q pins at the floor. False restores the
  # pre-normalization behaviour of runs up to #11.
  endo_exo_mi_normalize: False
  endo_exo_mi_norm_momentum: 0.99

  act_endo_mi_scale: 0.0
  # MINE's gradient bias correction; see mi_estimators.MINE.
  act_endo_mi_ema_decay: 0.99
  act_endo_mi_clip: 10.0

  act_exo_mi_scale: 0.0

  rew_endo_mi_scale: 0.1
  rew_endo_mi_ema_decay: 0.99
  rew_endo_mi_clip: 10.0

  # At the encoder bottleneck: embed feeds both deter and stoch, so there is
  # nowhere for the information to reroute, and xi_encoder is reward-free, so the
  # bound cannot strip reward feedback. Categorical q -- xi_stoch is a one-hot.
  embed_exo_mi_scale: 0.0

  rew_exo_mi_scale: 0.1
  # Bucket count for the two-hot return target, matching tools.DiscDist. G is the
  # discounted return-to-go over the rewards actually in the buffer -- not a critic
  # estimate, which would be a function of the endogenous stream being measured.
  rew_mi_bins: 255

  # All four pair terms use full feat regardless of endo_exo_mi_input, and condition
  # on a fixed one-hot of the task id (width task_train_size) -- not a learned
  # embedding, which could satisfy them by reshaping the task code rather than the
  # streams. s' is the next step, so the last timestep is dropped, as are steps
  # whose task_id is unlabelled or outside the train split.

  # Detached linear probes from deter/stoch to task id and optimal arm. Diagnostic
  # only: they never affect the world model. Needs labelled task_ids.
  probe_state: False
  probe_early_steps: 3

  grad_heads: [ 'decoder', 'reward', 'cont' ]
  units: 128
  reward_layers: 2
  cont_layers: 2
  value_layers: 2
  actor_layers: 2
  act: 'SiLU'
  norm: 'LayerNorm'
  encoder:
    { mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 2, mlp_units: 512, symlog_inputs: True }
  decoder:
    { mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: 'LayerNorm', cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 2, mlp_units: 512, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse }
  value_head: 'symlog_disc'
  reward_head: 'symlog_disc'
  # Feed the action to the reward head, so it is r = f(feat, a) and cannot fit reward
  # without representing the action. online-zsg's head is f(x_flat, action).
  reward_head_action: False
  # Which slice of get_feat the reward head reads: 'feat', 'stoch', 'deter'.
  # 'stoch' + reward_head_action matches online-zsg's f(x_flat, action).
  reward_head_input: 'feat'
  # Feed a learned task embedding to the reward head, so it is r = f(feat, a, e(task)).
  # Reward here is a function of (task, action) alone, so fitting it otherwise forces
  # feat to encode the task -- and the cheapest route to the task is the distractor.
  # Handing the head the task directly removes that pressure from the representation.
  # Safe because the head is never called at eval: the three call sites are the
  # imagination objective (dreamer.py), the disagreement bonus (exploration.py), and
  # the supervised fit, all on train data with labelled ids. The actor reads feat only.
  # Needs labelled task_ids; the embedding is sized task_train_size + 1 like the xi one,
  # with the last row for the -1 unlabelled id. Owned by the WorldModel, separate from
  # the xi table, so this stays independent of xi_ctx_cond.
  reward_head_task: False
  # Width of that embedding. Mirrors xi_ctx_dim but is its own knob.
  reward_head_task_dim: 16
  dyn_scale: '0.5'
  rep_scale: '0.1'
  kl_free: '1.0'
  cont_scale: 1.0
  reward_scale: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  action_unimix_ratio: 0.01
  initial: 'learned'
  reconstruction_window: 3

  # Training
  batch_size: 16
  batch_length: 64
  behavior_batch_length: 512
  hidden_states_subsample: 64
  sample_first: False
  train_ratio: 0.03
  mamba_context: True
  initial_wm_horizon: 50
  reach_wm_horizon_limit: -1
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  value_lr: 3e-5
  actor_lr: 3e-5
  ac_opt_eps: 1e-5
  value_grad_clip: 100
  actor_grad_clip: 100
  dataset_size: 1000000
  slow_value_target: True
  slow_target_update: 1
  slow_target_fraction: 0.02
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 10
  imag_gradient: 'dynamics'
  imag_gradient_mix: '0.0'
  imag_sample: True
  # Which slice of get_feat the actor reads: 'feat' (stoch+deter), 'stoch', 'deter'.
  # The value always reads the full feature.
  actor_input: 'feat'
  actor_dist: 'normal'
  actor_entropy: '3e-4'
  actor_state_entropy: 0.0
  actor_init_std: 1.0
  actor_min_std: 0.1
  actor_max_std: 1.0
  actor_temp: 0.1
  expl_amount: 0.0
  eval_state_mean: False
  collect_dyn_sample: True
  behavior_stop_grad: True
  value_decay: 0.0
  future_entropy: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False
  all_layers: 0

dmc_vision:
  steps: 3e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  video_pred_log: true
  encoder: { mlp_keys: '$^', cnn_keys: 'image' }
  decoder: { mlp_keys: '$^', cnn_keys: 'image' }

dmc_proprio:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  max_episode_length: 300
  logdir: ./dmc_proprio
  detach_image_from_obs: true
  encoder: { mlp_keys: '.*', cnn_keys: '$^' }
  decoder: { mlp_keys: '.*', cnn_keys: '$^' }

dmc_proprio_goal:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.03
  max_episode_length: 300
  logdir: ./dmc_proprio_goal
  detach_image_from_obs: true
  encoder: { mlp_keys: '.*', cnn_keys: "image" }
  decoder: { mlp_keys: '.*', cnn_keys: "image" }
  goal_dist_theta: 1
  goal_dist_radius: 1
  dense_reward: False
  small_state_space: True
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05
  num_goals: 1

panda_reacher:
  steps: 2e7
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.06
  envs: 1
  max_episode_length: 50
  num_meta_episodes: 3
  logdir: ./panda_reacher
  encoder: { mlp_keys: '.*', cnn_keys: "image" }
  decoder: { mlp_keys: '.*', cnn_keys: "image" }
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05

dmc_vision_goal:
  steps: 30e6
  reach_wm_horizon_limit: 5e6
  train_ratio: 0.06
  max_episode_length: 300
  logdir: ./dmc_vision_goal
  detach_image_from_obs: false
  encoder: { mlp_keys: '\b(reward|time_step)\b', cnn_keys: 'image' }
  decoder: { mlp_keys: '\b(reward|time_step)\b', cnn_keys: 'image' }
  goal_dist_theta: 1
  goal_dist_radius: 1
  dense_reward: False
  small_state_space: True
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05
  num_goals: 1

rooms:
  steps: 6e6
  reach_wm_horizon_limit: 5e6
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./rooms
  imag_gradient: 'reinforce'
  actor_dist: 'onehot'
  train_ratio: 0.1
  imag_horizon: 2
  num_cells: 3
  num_rooms: 3

halfcircle:
  steps: 2e6
  num_meta_episodes: 3
  initial_wm_horizon: 300
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./halfcircle
  train_ratio: 0.01
  imag_horizon: 2
  all_layers: 2
  max_episode_length: 100
  goal_radius: 2

halfcirclewind:
  steps: 2e6
  initial_wm_horizon: 300
  num_meta_episodes: 3
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./halfcirclewind
  train_ratio: 0.2
  imag_horizon: 10
  all_layers: 2
  max_episode_length: 100
  goal_radius: 2
  wind_force: 0.3

escaperoom:
  steps: 4e6
  initial_wm_horizon: 120
  num_meta_episodes: 2
  encoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  decoder: { mlp_keys: '.*', cnn_keys: None, mlp_layers: 4 }
  logdir: ./escaperoom
  train_ratio: 0.2
  imag_horizon: 10
  all_layers: 2
  max_episode_length: 60
  goal_radius: 2

humanoiddir:
  steps: 30e6
  reach_wm_horizon_limit: 15e6
  max_episode_length: 200
  num_meta_episodes: 2
  logdir: ./humanoid
  encoder: { mlp_keys: '.*', cnn_keys: '$^' }
  decoder: { mlp_keys: '.*', cnn_keys: '$^' }
  actor_lr: 6e-05
  model_lr: 2e-4
  value_lr: 6e-05

bandits:
  steps: 1e5
  # Must be positive: the world-model horizon curriculum divides by this, and the
  # default sentinel of -1 drives the horizon negative as training progresses.
  reach_wm_horizon_limit: 2e4
  logdir: ./bandits
  encoder: { mlp_keys: '.*', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64 }
  decoder: { mlp_keys: '.*', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64 }
  units: 64
  actor_dist: 'onehot'
  imag_gradient: 'reinforce'
  imag_horizon: 10
  all_layers: 2
  train_ratio: 0.1
  max_episode_length: 20
  initial_wm_horizon: 10
  num_meta_episodes: 1
  meta_learning: True
  task_split: True
  # 20/20/20 over 60 tasks. optimal_arm is index % num_arms, so each split of 20
  # holds exactly 4 tasks per arm -- a 4-task val set could not cover 5 arms, and
  # the old split put half of val on arm 2 while never exercising arms 0 or 1.
  test_repeats: 10
  prefill: 8
  num_arms: 5
  distractor_dim: 8
  reward_mode: 'binary'
  static_distractor: True
  generator_seed: 0

  actor_lr: 3e-04
  model_lr: 1e-3
  value_lr: 3e-04
  # actor_entropy: '1e-3'
  discount: 0.99
  
  log_every: 500
# Same as `bandits` but the distractor drifts within the episode, so it is harder
# to bind to a single optimal arm. Run as: --configs bandits bandits_drift
bandits_drift:
  logdir: ./bandits_drift
  static_distractor: False

# Image-observation counterpart of `bandits`: navigate to a hidden goal while a
# per-task colour tint offers "tint -> goal position" as a shortcut.
#   python dreamer.py --configs minigrid_confound --task minigrid_navigate
# The control, i.e. the ceiling any distractor run is measured against:
#   python dreamer.py --configs minigrid_confound --task minigrid_navigate --use_distractor False
minigrid_confound:
  steps: 5e5
  # Must be positive: the world-model horizon curriculum divides by this, and the
  # default sentinel of -1 drives the horizon negative as training progresses.
  reach_wm_horizon_limit: 1e5
  logdir: ./minigrid_confound
  # Pixels in, plus the small `state` vector carrying prev action and reward.
  encoder: { mlp_keys: 'state', cnn_keys: 'image' }
  decoder: { mlp_keys: 'state', cnn_keys: 'image' }
  size: [64, 64]
  actor_dist: 'onehot'
  imag_gradient: 'reinforce'
  imag_horizon: 15
  train_ratio: 0.1
  # batch_length is derived as num_meta_episodes * max_episode_length = 200 under
  # mamba_context, so it must stay above initial_wm_horizon.
  max_episode_length: 50
  # >1, unlike bandits: one navigation episode is the search, the rest are recall.
  # A single episode would leave nothing for the shortcut to short-cut.
  num_meta_episodes: 1
  initial_wm_horizon: 15
  meta_learning: True
  task_split: True
  test_repeats: 10
  task_train_size: 12
  task_val_size: 12
  task_test_size: 20
  # 2 goal positions x 20 tasks per split = 10 tasks per goal in every split, so
  # a task-id probe that knows only the goal caps at 1/10 = 0.1. Anything above
  # that is non-behavioural information, i.e. the tint.
  minigrid_layout: 'empty'
  minigrid_size: 9
  distractor_strength: 0.3
  # The goal never renders, so it can only be found by walking onto it.
  hide_goal: True
  fixed_start: True
  partial_obs: False
  generator_seed: 0

  actor_lr: 3e-05
  model_lr: 1e-4
  value_lr: 3e-05
  discount: 0.99

# Harder binding: the agent sees only its egocentric view, so the tint covers the
# visible region rather than the whole map. Run as:
#   --configs minigrid_confound minigrid_fourrooms
minigrid_fourrooms:
  logdir: ./minigrid_fourrooms
  minigrid_layout: 'fourrooms'
  minigrid_size: 9
  partial_obs: True

# The denoising method, on. Four mechanisms that only produce the result together
# -- each is documented at its default in `defaults`, and each stays independently
# overridable from the CLI. Env-agnostic: compose it with any env block.
#   --configs bandits denoised --task bandits_distractor
# Needs labelled task_ids, i.e. task_split: True and train ids 0..task_train_size-1.
denoised:
  use_exo: True
  xi_ctx_cond: True
  xi_ctx_scale: 1.0
  branch_decorr_scale: 0.5
  reward_head_action: True
  reward_head_task: True

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20
